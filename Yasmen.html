<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>students average</title>
</head>
<body>

    <h1>students average</h1>

    <script>
        const students = [
            {id: 1, average: 85},
            {id: 2, average: 55}, 
            {id: 3, average: 90},
            {id: 4, average: 38},
            {id: 5, average: 40},
            {id: 6, average: 60},
        ];

        const X = students.filter(s => s.average);
        const Y = X.map(s => s.average + 5);
        const Z = Y.reduce((sum, B) => sum + B, 0);

        let A = 0;

        if (X.length > 0)
        {
            A = Z / X.length;
        }

        console.log("students:", students);
        console.log("filter:", X);
        console.log("map:", Y);
        console.log("reduce:", Z);
        console.log("final average:", A);

    </script>

</body>
</html>
